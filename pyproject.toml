[project]
name = "seabattle"
version = "0.1.0"
description = "Боты для хакатона «Морской бой»: ядро платформы и сменные стратегии"
requires-python = ">=3.13"
dependencies = ["websockets>=15,<18"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[tool.setuptools]
packages = ["seabattle", "strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["seabattle", "strategies", "bot_1", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "C4", "PT", "TRY", "S", "T20", "A", "ARG", "ERA", "N"]
ignore = ["TRY003", "PLR2004", "S311", "TRY400", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR0913", "ARG001", "ARG002"]
